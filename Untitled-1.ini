<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الأعمال | ثلاثون درجة للاستشارات الهندسية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gallery.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- شريط التنقل -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">ثلاثون درجة</a>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="about.html">حول</a></li>
                <li><a href="services.html">الخدمات</a></li>
                <li><a href="gallery.html" class="active">معرض الأعمال</a></li>
                <li><a href="testimonials.html">التزكيات</a></li>
                <li><a href="contact.html">الاتصال</a></li>
            </ul>
            <button class="menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- قسم معرض الأعمال -->
    <section class="gallery-section">
        <div class="container">
            <h1 class="section-title">معرض أعمالنا</h1>
            <p class="section-subtitle">استعرض بعض مشاريعنا الناجحة في مجال الاستشارات الهندسية والسلامة</p>
            
            <!-- فلاتر التصنيف -->
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">الكل</button>
                <button class="filter-btn" data-filter="commercial">تجارية</button>
                <button class="filter-btn" data-filter="residential">سكنية</button>
                <button class="filter-btn" data-filter="industrial">صناعية</button>
                <button class="filter-btn" data-filter="hospitals">مستشفيات</button>
                <button class="filter-btn" data-filter="hotels">فنادق</button>
            </div>
            
            <!-- معرض الصور -->
            <div class="gallery-container">
                <!-- سيتم إضافة العناصر ديناميكيًا بواسطة JavaScript -->
            </div>
            
            <!-- نموذج إضافة مشروع جديد (للمسؤول) -->
            <div class="add-project-form" id="admin-form">
                <h3>إضافة مشروع جديد (للمسؤول)</h3>
                <form id="project-form">
                    <input type="text" id="project-title" placeholder="عنوان المشروع" required>
                    <input type="text" id="project-category" placeholder="التصنيف (commercial, residential, etc.)" required>
                    <textarea id="project-description" placeholder="وصف المشروع" required></textarea>
                    <input type="text" id="project-image" placeholder="رابط الصورة" required>
                    <input type="text" id="project-year" placeholder="سنة الإنجاز" required>
                    <button type="submit" class="btn">إضافة المشروع</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>شركة ثلاثون درجة للاستشارات الهندسية</h3>
                    <p>السلامة أولويتنا، وأمان منشآتك هدفنا!</p>
                </div>
                <div class="footer-section">
                    <h4>معلومات الاتصال</h4>
                    <p><i class="fas fa-map-marker-alt"></i> 7980 Prince Majid Road, Jeddah</p>
                    <p><i class="fas fa-phone"></i> +966-552247670</p>
                    <p><i class="fas fa-envelope"></i> info@30dgree.com</p>
                </div>
                <div class="footer-section">
                    <h4>روابط سريعة</h4>
                    <ul>
                        <li><a href="index.html">الرئيسية</a></li>
                        <li><a href="about.html">من نحن</a></li>
                        <li><a href="gallery.html">معرض الأعمال</a></li>
                        <li><a href="contact.html">اتصل بنا</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>حقوق النشر © 2024 جميع الحقوق محفوظة</p>
                <p>يعمل بواسطة SITE123 - تصميم مواقع</p>
            </div>
        </div>
    </footer>

    <!-- نافذة العرض الموسع -->
    <div class="lightbox" id="lightbox">
        <span class="close-lightbox">&times;</span>
        <img class="lightbox-img" src="" alt="">
        <div class="lightbox-content">
            <h3 id="lightbox-title"></h3>
            <p id="lightbox-description"></p>
            <p id="lightbox-details"></p>
        </div>
        <button class="lightbox-nav prev"><i class="fas fa-chevron-right"></i></button>
        <button class="lightbox-nav next"><i class="fas fa-chevron-left"></i></button>
    </div>

    <script src="gallery.js"></script>
</body>
</html>